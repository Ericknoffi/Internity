<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Analyzer</title>
</head>
<body>
    <h1>Job Description Analyzer</h1>

    {% if error %}
        <div style="color: red; font-weight: bold;">
            Error: {{ error }}
        </div>
    {% endif %}

    <form action="{{ url_for('analyze') }}" method="POST" enctype="multipart/form-data">
        
        <label for="input_type">Select Input Type:</label>
        <select name="input_type" id="input_type">
            <option value="text">Paste Text</option>
            <option value="url">URL</option>
            <option value="pdf">PDF Upload</option>
        </select>

        <br><br>

        <textarea name="job_text" placeholder="Paste job description here (min 50 chars)..." rows="5" cols="40"></textarea>
        
        <br><br>

        <input type="text" name="url" placeholder="https://example.com/job">
        
        <br><br>

        <input type="file" name="pdf_file" accept=".pdf">

        <br><br>

        <button type="submit">Analyze</button>
    </form>
</body>
</html>
